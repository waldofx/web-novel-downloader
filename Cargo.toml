[workspace]
resolver = "3"
members = ["crates/core", "crates/sources", "crates/download", "crates/export", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/waldofx/web-novel-downloader"

[workspace.dependencies]
wnd-core = { path = "crates/core" }
wnd-sources = { path = "crates/sources" }
wnd-download = { path = "crates/download" }
wnd-export = { path = "crates/export" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
url = "2"
clap = { version = "4", features = ["derive"] }
scraper = "0.27"
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
# Flate2 without zopfli: deflate at a sane speed, pure-Rust backend, no C toolchain.
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
