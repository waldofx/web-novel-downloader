[workspace]
resolver = "3"
members = ["crates/core", "crates/sources", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/waldofx/web-novel-downloader"

[workspace.dependencies]
wnd-core = { path = "crates/core" }
wnd-sources = { path = "crates/sources" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
url = "2"
clap = { version = "4", features = ["derive"] }
scraper = "0.27"
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
