[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/sources",
    "crates/download",
    "crates/export",
    "crates/cli",
    "apps/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/waldofx/web-novel-downloader"

[workspace.dependencies]
wnd-core = { path = "crates/core" }
wnd-sources = { path = "crates/sources" }
wnd-download = { path = "crates/download" }
wnd-export = { path = "crates/export" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
url = "2"
clap = { version = "4", features = ["derive"] }
scraper = "0.27"
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
# Flate2 without zopfli: deflate at a sane speed, pure-Rust backend, no C toolchain.
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
# The desktop app. Tauri brings its own webview bindings; `withGlobalTauri`
# means the front end is plain HTML and JavaScript, with no npm in the build.
tauri = "2"
tauri-build = "2"
# A native "choose a folder" dialog, called from Rust. The Tauri dialog plugin
# would be the same crate behind a permission, and this is the whole of what the
# app needs from it.
rfd = "0.15"

# The build cache is not the product. Full debug information and an incremental
# cache once took `target/debug` to 25 GB across repeated Tauri test builds;
# line tables keep a panic's location without the rest, and dependencies need no
# debug info at all. See docs/engineering/testing.md#the-build-cache.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = false
